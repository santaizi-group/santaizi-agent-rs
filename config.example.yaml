# 三太子 Rust 探针配置（Go 探针键名对齐的子集）
# 标量键可被 SANTAIZI_* 环境变量覆盖（如 SANTAIZI_SERVER），CLI 参数优先级最高；
# Go 全量配置里本实现不读的键（dns、ip_report_interface、telemetry.wal 等）静默忽略。
server: "localhost:5555"
client_secret: ""

# 上报通路：v2（默认，Control+Ingest 流，对齐 Go 探针）或 v1（unary 回退）
protocol: "v2"

# gRPC TLS（面板 grpc_tls.enabled 时打开）。true 时 v2 通路会 Enroll 设备证到 telemetry.data_dir/pki/
tls: false
# 自签 CA 证书路径（PEM）
# tls_ca_file: ""
# 暂不支持跳过证书校验
# insecure_tls: false

# State 上报间隔秒数（1-3600，仅 v1 通路）
report_delay: 5
# IP/归属地自查周期秒数（<60 拒绝启动；双栈均失败时固定 60 秒快重试）
ip_report_period: 1800
# 固定国家码（可选，覆盖自查）
# country_code: ""
# 归属地国家码取 IPv6 自查结果（默认 false 取 IPv4）
# use_ipv6_countrycode: false
# 只统计列表内网卡（精确匹配接口名；非空时取代内置排除规则，兼容 Go 的 map 写法）
# nic_allowlist: ["eth0"]
# 只统计列表内磁盘分区（精确匹配挂载点；非空时取代内置文件系统白名单）
# hard_drive_partition_allowlist: ["/"]

# 能力开关（缺省与 Go 对齐；GPU / NAT 本实现不上报）
# capabilities:
#   http_probe: true
#   icmp_probe: true
#   tcp_probe: true
#   temperature: false

# v2 通路
telemetry:
  data_dir: "/var/lib/santaizi-agent"
  state_interval: 5
  heartbeat_interval: 10
  host_interval: 600
  batch_size: 256
  # 设备证到期前多少天触发续期（0 视为 7）
  # cert_renew_days: 7
  # 按 endpoint id 覆盖从端地址（不能私自加未分配观测点）
  # collectors:
  #   - id: "<collector-id>"
  #     address: "observer.example:5555"
  #     tls: true
  # disabled_remote_ids: []

debug: false
