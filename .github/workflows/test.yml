name: Run Tests

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: santaizi-group/santaizi-agent
          path: upstream-agent

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2

      - name: Check vendored proto
        run: |
          set -euo pipefail
          if ! diff -u proto/santaizi.proto upstream-agent/proto/santaizi.proto; then
            echo "proto/santaizi.proto drifted from santaizi-agent/proto/santaizi.proto" >&2
            echo "Copy the upstream file into this repo's proto/ and commit." >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  # Release is the only other place that links aarch64. BoringSSL's C++ objects
  # must be built with the cross g++; catch that before the next tag.
  cross:
    name: Cross build (linux arm64)
    runs-on: ubuntu-latest
    env:
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aarch64 GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
