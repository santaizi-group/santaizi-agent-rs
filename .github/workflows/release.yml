name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # 发布产物是静态 musl（script/build-release.sh），不带 glibc，
          # 任何 Linux 都能跑；Go 探针静态链接也是同一取向。
          # target 选镜像，triple 是 cargo 目标（产物路径用 triple）。
          - target: x86_64-musl
            triple: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
          - target: aarch64-musl
            triple: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64

    name: Build artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid tag: $tag"
            echo "Expected SemVer vMAJOR.MINOR.PATCH (v0.x allowed)"
            exit 1
          fi

      - name: Sync crate version from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Only bump [package] version, not dependency versions.
          sed -i '0,/^version = /s/^version = ".*"/version = "'"${version}"'"/' Cargo.toml

      # 不能直接在 runner 上 cargo build：ubuntu-latest 是 glibc 2.39，产物会要求
      # GLIBC_2.38/2.39，Debian 11/12、Ubuntu 20.04/22.04 的 loader 拒绝启动
      # （systemd 里只看到 status=1/FAILURE）。改为容器里出静态 musl 产物，
      # 细节见 script/build-release.sh。
      - name: Build
        run: ./script/build-release.sh ${{ matrix.target }}

      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.triple }}/release/santaizi-agent-rs" dist/santaizi-agent-rs
          zip -j "dist/santaizi-agent-rs_${{ matrix.goos }}_${{ matrix.goarch }}.zip" dist/santaizi-agent-rs

      # Private repos on GitHub Free share a ~500MB Actions artifact quota
      # across the whole account. Stage binaries on a per-run draft release
      # instead so publish jobs are not blocked by that quota.
      - name: Upload binaries to temporary release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if gh release view "$CI_TAG" >/dev/null 2>&1; then
              break
            fi
            gh release create "$CI_TAG" \
              --draft \
              --target "${{ github.sha }}" \
              --title "CI artifacts ${{ github.run_id }}" \
              --notes "Temporary build outputs for ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Deleted after publish." \
              && break || true
            sleep 2
          done
          gh release view "$CI_TAG" >/dev/null
          shopt -s nullglob
          files=(dist/santaizi-agent-rs_${{ matrix.goos }}_${{ matrix.goarch }}*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no build outputs to upload" >&2
            exit 1
          fi
          gh release upload "$CI_TAG" "${files[@]}" --clobber

  release:
    runs-on: ubuntu-latest
    needs: build
    name: Release
    permissions:
      contents: write
    steps:
      # gh infers the repo from git remotes. This job has no checkout, so
      # GH_REPO is required; otherwise download fails with "not a git repository".
      - name: Download binaries from temporary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          mkdir -p bin
          gh release download "$CI_TAG" --dir bin
          ls -la bin/

      - name: Checksum
        run: sha256sum ./bin/*.zip | awk -F" |/" '{print $1, $NF}' > checksums.txt

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "checksums.txt,bin/*.zip"
          generateReleaseNotes: true

  cleanup:
    name: Cleanup CI release
    permissions:
      contents: write
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary CI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          if gh release view "$CI_TAG" >/dev/null 2>&1; then
            gh release delete "$CI_TAG" --yes
          else
            echo "no temporary release $CI_TAG to delete"
          fi
          # Drafts may be untagged; ignore a missing git ref.
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${CI_TAG}" >/dev/null 2>&1 || true
